# GPIO and LED
CONFIG_GPIO=y

# Serial console
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_KERNEL_SHELL=n

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y

# PPP
CONFIG_NET_DRIVERS=y
CONFIG_NET_PPP=y
CONFIG_NET_L2_PPP=y
CONFIG_NET_PPP_RINGBUF_SIZE=1024
CONFIG_NET_PPP_RX_STACK_SIZE=2048
CONFIG_NET_L2_PPP_MAX_CONFIGURE_REQ_RETRANSMITS=30

# Network management events
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONNECTION_MANAGER=y

# Network shell commands (net iface, net ping, etc.)
CONFIG_NET_SHELL=y

# Network buffers — sized for PPP retransmit headroom
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=32

# Stack sizes
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Kernel events
CONFIG_EVENTS=y

# Logging
CONFIG_LOG=y

# Network statistics (net stats shell command)
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PPP=y
CONFIG_NET_STATISTICS_UDP=y
CONFIG_NET_STATISTICS_PER_INTERFACE=y

# zperf — iperf-compatible throughput/jitter/loss measurement
CONFIG_NET_ZPERF=y
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_EVENTFD_MAX=4
CONFIG_NET_SOCKETS_POLL_MAX=12
